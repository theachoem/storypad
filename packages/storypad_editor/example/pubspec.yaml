name: storypad_editor_example
description: >-
  Standalone example and manual-test app for storypad_editor. Defines the demo
  embeds (media/album, audio, date) app-side, the way StoryPad's app will.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  storypad_editor:
    path: ../

dev_dependencies:
  collection: ^1.19.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
